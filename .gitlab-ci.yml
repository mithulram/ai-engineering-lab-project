# GitLab CI/CD Pipeline for AI Object Counting Application
# Week 3: Training Pipeline with Safety Model

stages:
  - test
  - train
  - deploy

variables:
  # Python configuration
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.9"
  
  # Model artifacts
  MODEL_ARTIFACTS_DIR: "model_artifacts"
  SAFETY_MODEL_DIR: "safety_models"
  
  # Training configuration
  TRAINING_EPOCHS: "10"
  BATCH_SIZE: "32"
  LEARNING_RATE: "0.001"

# Cache pip dependencies
cache:
  paths:
    - .cache/pip/
    - .huggingface_cache/

# Test stage - runs on all branches
test:
  stage: test
  image: python:3.9-slim
  before_script:
    - apt-get update && apt-get install -y build-essential curl
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Running unit tests..."
    - python -m pytest test_*.py -v --tb=short
    - echo "Running safety module tests..."
    - python -m pytest test_safety.py -v --tb=short
    - echo "Running Week 2 verification tests..."
    - python test_week2_metrics.py
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - test-results/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - week2
    - week3
    - training-safety

# Training stage - runs only on training branches with GPU
train_safety_model:
  stage: train
  image: nvidia/cuda:11.8-devel-ubuntu20.04
  tags:
    - a100  # Requires GPU runner with A100
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip build-essential curl
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -r requirements.txt
    - python3 -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
  script:
    - echo "Starting safety model training on A100 GPU..."
    - echo "CUDA available: $(python3 -c 'import torch; print(torch.cuda.is_available())')"
    - echo "GPU count: $(python3 -c 'import torch; print(torch.cuda.device_count())')"
    - echo "GPU name: $(python3 -c 'import torch; print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"No GPU\")')"
    
    # Create training data directory
    - mkdir -p training_data/safety
    - mkdir -p $MODEL_ARTIFACTS_DIR
    - mkdir -p $SAFETY_MODEL_DIR
    
    # Generate synthetic training data for safety model
    - echo "Generating synthetic training data..."
    - python3 -c "
import json
import os
import random
from datetime import datetime

# Generate synthetic safety training data
training_data = {
    'military_vehicles': [
        {'text': 'count tanks in this image', 'label': 'blocked', 'confidence': 0.95},
        {'text': 'how many armored vehicles', 'label': 'blocked', 'confidence': 0.92},
        {'text': 'number of fighter jets', 'label': 'blocked', 'confidence': 0.88},
        {'text': 'count warships', 'label': 'blocked', 'confidence': 0.90},
        {'text': 'artillery pieces in image', 'label': 'blocked', 'confidence': 0.85}
    ],
    'civilian_vehicles': [
        {'text': 'count cars in parking lot', 'label': 'allowed', 'confidence': 0.95},
        {'text': 'how many bicycles', 'label': 'allowed', 'confidence': 0.92},
        {'text': 'number of trucks', 'label': 'allowed', 'confidence': 0.88},
        {'text': 'count motorcycles', 'label': 'allowed', 'confidence': 0.90},
        {'text': 'buses in station', 'label': 'allowed', 'confidence': 0.85}
    ],
    'suspicious_patterns': [
        {'text': 'count camouflaged vehicles', 'label': 'blocked', 'confidence': 0.80},
        {'text': 'military equipment count', 'label': 'blocked', 'confidence': 0.85},
        {'text': 'tactical vehicle analysis', 'label': 'blocked', 'confidence': 0.82}
    ]
}

# Save training data
with open('training_data/safety/training_data.json', 'w') as f:
    json.dump(training_data, f, indent=2)

print('Training data generated successfully')
"
    
    # Train safety model
    - echo "Training safety classification model..."
    - python3 -c "
import json
import torch
import torch.nn as nn
from transformers import AutoTokenizer, AutoModel
import numpy as np
from sklearn.model_selection import train_test_split
from sklearn.metrics import accuracy_score, classification_report
import joblib

# Load training data
with open('training_data/safety/training_data.json', 'r') as f:
    data = json.load(f)

# Prepare training data
texts = []
labels = []
for category, examples in data.items():
    for example in examples:
        texts.append(example['text'])
        labels.append(1 if example['label'] == 'blocked' else 0)

# Split data
X_train, X_test, y_train, y_test = train_test_split(texts, labels, test_size=0.2, random_state=42)

print(f'Training samples: {len(X_train)}')
print(f'Test samples: {len(X_test)}')

# Simple safety model training (placeholder for actual model)
class SafetyClassifier:
    def __init__(self):
        self.military_keywords = ['tank', 'armored', 'military', 'war', 'combat', 'weapon', 'gun', 'missile', 'rocket', 'bomb', 'fighter', 'bomber', 'helicopter', 'warship', 'destroyer', 'submarine', 'artillery', 'cannon']
        self.suspicious_patterns = ['camouflage', 'tactical', 'strategic', 'defense', 'combat', 'warfare']
    
    def predict(self, text):
        text_lower = text.lower()
        military_score = sum(1 for keyword in self.military_keywords if keyword in text_lower)
        suspicious_score = sum(1 for pattern in self.suspicious_patterns if pattern in text_lower)
        
        total_score = military_score + suspicious_score
        return 1 if total_score > 0 else 0
    
    def predict_proba(self, text):
        text_lower = text.lower()
        military_score = sum(1 for keyword in self.military_keywords if keyword in text_lower)
        suspicious_score = sum(1 for pattern in self.suspicious_patterns if pattern in text_lower)
        
        total_score = military_score + suspicious_score
        blocked_prob = min(0.95, total_score * 0.3)
        allowed_prob = 1.0 - blocked_prob
        
        return [[allowed_prob, blocked_prob]]

# Train model
model = SafetyClassifier()

# Evaluate model
y_pred = [model.predict(text) for text in X_test]
accuracy = accuracy_score(y_test, y_pred)

print(f'Model accuracy: {accuracy:.3f}')

# Save model
joblib.dump(model, 'safety_models/safety_classifier.pkl')

# Save model metadata
model_metadata = {
    'model_name': 'safety_classifier',
    'version': '1.0.0',
    'training_date': '2025-09-15',
    'accuracy': accuracy,
    'training_samples': len(X_train),
    'test_samples': len(X_test),
    'features': ['military_keywords', 'suspicious_patterns'],
    'model_type': 'rule_based_classifier'
}

with open('safety_models/model_metadata.json', 'w') as f:
    json.dump(model_metadata, f, indent=2)

print('Safety model training completed successfully')
"
    
