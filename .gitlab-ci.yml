    - echo "Training completed successfully!"
  artifacts:
    name: "safety-model-${CI_COMMIT_SHORT_SHA}"
    paths:
      - $MODEL_ARTIFACTS_DIR/
      - $SAFETY_MODEL_DIR/
      - training_data/
    reports:
      junit: training-results.xml
    expire_in: 30 days
  only:
    - training-safety
    - training/*
  when: manual  # Manual trigger for training jobs

# Fast test mode for local development
train_safety_model_fast:
  stage: train
  image: python:3.9-slim
  before_script:
    - apt-get update && apt-get install -y build-essential curl
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install scikit-learn joblib
  script:
    - echo "Running fast test mode training (no GPU required)..."
    - echo "This is a lightweight version for local testing"
    
    # Create directories
    - mkdir -p training_data/safety
    - mkdir -p $MODEL_ARTIFACTS_DIR
    - mkdir -p $SAFETY_MODEL_DIR
    
    # Run fast training
    - python3 -c "
import json
import os
from datetime import datetime

# Generate minimal training data
training_data = {
    'military_vehicles': [
        {'text': 'count tanks', 'label': 'blocked', 'confidence': 0.95},
        {'text': 'armored vehicles', 'label': 'blocked', 'confidence': 0.92}
    ],
    'civilian_vehicles': [
        {'text': 'count cars', 'label': 'allowed', 'confidence': 0.95},
        {'text': 'bicycles in park', 'label': 'allowed', 'confidence': 0.92}
    ]
}

# Save training data
with open('training_data/safety/training_data.json', 'w') as f:
    json.dump(training_data, f, indent=2)

# Create simple model
class FastSafetyModel:
    def __init__(self):
        self.military_keywords = ['tank', 'armored', 'military', 'war', 'combat']
    
    def predict(self, text):
        return 1 if any(keyword in text.lower() for keyword in self.military_keywords) else 0

# Save model
import joblib
model = FastSafetyModel()
joblib.dump(model, 'safety_models/fast_safety_model.pkl')

# Save metadata
metadata = {
    'model_name': 'fast_safety_model',
    'version': '1.0.0-fast',
    'training_date': datetime.now().isoformat(),
    'mode': 'fast_test',
    'gpu_required': False
}

with open('safety_models/fast_model_metadata.json', 'w') as f:
    json.dump(metadata, f, indent=2)

print('Fast test mode training completed')
"
    
    - echo "Fast test mode training completed successfully!"
  artifacts:
    name: "fast-safety-model-${CI_COMMIT_SHORT_SHA}"
    paths:
      - $MODEL_ARTIFACTS_DIR/
      - $SAFETY_MODEL_DIR/
      - training_data/
    expire_in: 7 days
  only:
    - merge_requests
    - main
    - week2
    - week3
  when: manual

# Deploy stage - deploy trained models
deploy_models:
  stage: deploy
  image: python:3.9-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Deploying trained safety models..."
    - echo "Model artifacts available:"
    - ls -la $MODEL_ARTIFACTS_DIR/ || echo "No model artifacts found"
    - ls -la $SAFETY_MODEL_DIR/ || echo "No safety models found"
    
    # Validate model artifacts
    - python3 -c "
import json
import os

# Check if model artifacts exist
artifacts_dir = '$MODEL_ARTIFACTS_DIR'
safety_dir = '$SAFETY_MODEL_DIR'

if os.path.exists(artifacts_dir):
    print(f'Model artifacts found in {artifacts_dir}:')
    for file in os.listdir(artifacts_dir):
        print(f'  - {file}')
else:
    print('No model artifacts found')

if os.path.exists(safety_dir):
    print(f'Safety models found in {safety_dir}:')
    for file in os.listdir(safety_dir):
        print(f'  - {file}')
else:
    print('No safety models found')

print('Model deployment validation completed')
"
    
    - echo "Model deployment completed successfully!"
  artifacts:
    name: "deployed-models-${CI_COMMIT_SHORT_SHA}"
    paths:
      - $MODEL_ARTIFACTS_DIR/
      - $SAFETY_MODEL_DIR/
    expire_in: 90 days
  only:
    - training-safety
    - main
  when: manual
  dependencies:
    - train_safety_model