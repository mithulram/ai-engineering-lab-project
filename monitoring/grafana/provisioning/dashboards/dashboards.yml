apiVersion: 1

providers:
  - name: 'AI Object Counting Dashboards'
    orgId: 1
    folder: 'AI Object Counting'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
    dashboard_files:
      - pipeline_overview.json
      - version_comparison.json
      - safety_misuse.json
      - resource_latency.json
      - week3_safety_monitoring.json
